; ESP32 CAN R01 - pF meter
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

board_build.f_cpu = 240000000L

upload_speed  = 460800
monitor_speed = 9600
monitor_filters = esp32_exception_decoder, default

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
