<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Data flows from an ESP32 sensor node to a Raspberry Pi 5 running edge AI, then to an LLM agent that sells robusta coffee">
  <defs>
    <!-- background -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#5a3622"/>
      <stop offset="0.55" stop-color="#2f1d13"/>
      <stop offset="1" stop-color="#170e09"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>

    <!-- card faces -->
    <linearGradient id="faceEsp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a52"/><stop offset="1" stop-color="#15282d"/>
    </linearGradient>
    <linearGradient id="facePi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b3a"/><stop offset="1" stop-color="#173d20"/>
    </linearGradient>
    <linearGradient id="faceLlm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a7a"/><stop offset="1" stop-color="#2a1840"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f7"/><stop offset=".5" stop-color="#b9c0c4"/><stop offset="1" stop-color="#7d868c"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff6d6"/><stop offset=".35" stop-color="#f2c14e"/><stop offset="1" stop-color="#c9741e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beanGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#b07a50"/><stop offset=".6" stop-color="#7a4a2c"/><stop offset="1" stop-color="#4a2a18"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb3a9"/><stop offset=".5" stop-color="#8cc63f"/><stop offset="1" stop-color="#b88cff"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="far" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>

    <g id="bean">
      <ellipse cx="0" cy="0" rx="12" ry="17" fill="url(#beanGrad)"/>
      <path d="M0,-15 C-6,-5 6,5 0,15" stroke="#2e1a0f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-4" cy="-7" rx="3" ry="5" fill="#fff" opacity=".18"/>
    </g>

    <!-- data paths between the cards -->
    <path id="p1" d="M330,150 C385,108 435,108 488,150"/>
    <path id="p2" d="M712,150 C767,108 817,108 870,150"/>

    <style>
      .flow   { stroke-dasharray: 10 12; animation: flow 1.2s linear infinite; }
      .blink  { animation: blink 1.6s ease-in-out infinite; }
      .fan    { animation: spin 2.2s linear infinite; transform-box: fill-box; transform-origin: center; }
      .breath { animation: breath 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bob1 { animation: bob 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bob2 { animation: bob 9s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
      .bob3 { animation: bob 8s ease-in-out infinite; animation-delay: -4s; transform-box: fill-box; transform-origin: center; }
      .wave { animation: wave 2s ease-out infinite; }
      @keyframes flow   { to { stroke-dashoffset: -22; } }
      @keyframes blink  { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes breath { 0%, 100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes bob    { 0%, 100% { transform: translateY(0) rotate(-14deg); } 50% { transform: translateY(-12px) rotate(14deg); } }
      @keyframes wave   { 0% { opacity: .9; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .blink, .fan, .breath, .bob1, .bob2, .bob3, .wave { animation: none; }
        .packet { display: none; }
      }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect y="200" width="1200" height="100" fill="url(#floor)"/>
  <g filter="url(#far)" opacity=".35">
    <use href="#bean" transform="translate(60,70) rotate(20) scale(.8)"/>
    <use href="#bean" transform="translate(410,268) rotate(-30) scale(.7)"/>
    <use href="#bean" transform="translate(785,38) rotate(40) scale(.75)"/>
    <use href="#bean" transform="translate(1150,250) rotate(-15) scale(.8)"/>
  </g>

  <!-- connectors -->
  <g fill="none" stroke-linecap="round">
    <use href="#p1" stroke="#000" stroke-opacity=".35" stroke-width="10" transform="translate(0,6)"/>
    <use href="#p2" stroke="#000" stroke-opacity=".35" stroke-width="10" transform="translate(0,6)"/>
    <use href="#p1" stroke="#1d1410" stroke-width="10"/>
    <use href="#p2" stroke="#1d1410" stroke-width="10"/>
    <use href="#p1" class="flow" stroke="#7fd1c7" stroke-width="3.5"/>
    <use href="#p2" class="flow" stroke="#c9a6ff" stroke-width="3.5"/>
  </g>
  <!-- arrow heads -->
  <path d="M480,138 L496,152 L476,158 Z" fill="#9fe0a0"/>
  <path d="M862,138 L878,152 L858,158 Z" fill="#d3b8ff"/>

  <!-- data packets riding the connectors -->
  <g class="packet">
    <g>
      <rect x="-30" y="-11" width="60" height="22" rx="11" fill="#0f2a2c" stroke="#7fd1c7" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#bff3ec">12.1 %</text>
      <animateMotion dur="3s" repeatCount="indefinite" rotate="0"><mpath href="#p1"/></animateMotion>
    </g>
    <g>
      <rect x="-38" y="-11" width="76" height="22" rx="11" fill="#22143a" stroke="#c9a6ff" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#e6d6ff">defect 3%</text>
      <animateMotion dur="3s" begin="0s" repeatCount="indefinite" rotate="0"><mpath href="#p2"/></animateMotion>
    </g>
  </g>

  <!-- ========== card 1: ESP32 ========== -->
  <g transform="translate(220,150)" filter="url(#shadow)">
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="#0c1a1d" transform="translate(0,9)"/>
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="url(#faceEsp)" stroke="#4fb3a9" stroke-width="2"/>
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="url(#gloss)"/>
    <!-- pins -->
    <g fill="#d9b24a">
      <rect x="-86" y="-74" width="7" height="10" rx="1"/><rect x="-70" y="-74" width="7" height="10" rx="1"/><rect x="-54" y="-74" width="7" height="10" rx="1"/>
      <rect x="-38" y="-74" width="7" height="10" rx="1"/><rect x="-22" y="-74" width="7" height="10" rx="1"/><rect x="-6" y="-74" width="7" height="10" rx="1"/>
      <rect x="10" y="-74" width="7" height="10" rx="1"/><rect x="26" y="-74" width="7" height="10" rx="1"/>
    </g>
    <!-- shielded module -->
    <rect x="-62" y="-50" width="92" height="66" rx="6" fill="url(#metal)" stroke="#5c656b" stroke-width="1.5"/>
    <text x="-16" y="-12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="17" fill="#2b3237">ESP32</text>
    <text x="-16" y="6" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="7.6" fill="#4a535a">Wi-Fi · ADC · PWM</text>
    <!-- antenna -->
    <path d="M40,-48 h10 v10 h-10 v10 h10 v10 h-10 v10 h10" fill="none" stroke="#d9b24a" stroke-width="2.4"/>
    <!-- wifi waves -->
    <g fill="none" stroke="#bff3ec" stroke-width="2.6" stroke-linecap="round">
      <path class="wave" d="M66,-40 a18,18 0 0 1 0,24"/>
      <path class="wave" style="animation-delay:.4s" d="M76,-50 a32,32 0 0 1 0,44"/>
    </g>
    <circle cx="74" cy="22" r="5" fill="#4fff9a" class="blink" filter="url(#glow)"/>
    <text x="0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7f6f3">Track 1 · Sensor node</text>
  </g>

  <!-- ========== card 2: Raspberry Pi 5 ========== -->
  <g transform="translate(600,150)" filter="url(#shadow)">
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="#0d220f" transform="translate(0,9)"/>
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="url(#facePi)" stroke="#8cc63f" stroke-width="2"/>
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="url(#gloss)"/>
    <!-- usb / ethernet stack -->
    <rect x="64" y="-56" width="34" height="26" rx="3" fill="url(#metal)"/>
    <rect x="64" y="-24" width="34" height="26" rx="3" fill="url(#metal)"/>
    <rect x="64" y="8" width="34" height="18" rx="3" fill="url(#metal)"/>
    <!-- SoC -->
    <rect x="-74" y="-50" width="64" height="64" rx="6" fill="url(#chip)" stroke="#6c6c6c"/>
    <text x="-42" y="-14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#e8e8e8">Pi 5</text>
    <text x="-42" y="2" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="8.5" fill="#aaa">ONNX · CPU</text>
    <!-- fan -->
    <g transform="translate(26,-18)">
      <circle r="24" fill="#111" stroke="#555" stroke-width="2"/>
      <g class="fan" fill="#3a3a3a">
        <path d="M0,0 C6,-20 16,-18 18,-10 Z"/><path d="M0,0 C20,6 18,16 10,18 Z"/>
        <path d="M0,0 C-6,20 -16,18 -18,10 Z"/><path d="M0,0 C-20,-6 -18,-16 -10,-18 Z"/>
      </g>
      <circle r="5" fill="#777"/>
    </g>
    <!-- detected beans -->
    <use href="#bean" transform="translate(-70,24) rotate(-25) scale(.55)"/>
    <rect x="-82" y="11" width="24" height="26" rx="3" fill="none" stroke="#9fe0a0" stroke-width="1.8" class="blink"/>
    <use href="#bean" transform="translate(-36,24) rotate(15) scale(.55)"/>
    <rect x="-48" y="11" width="24" height="26" rx="3" fill="none" stroke="#ff8a6b" stroke-width="1.8" class="blink" style="animation-delay:.8s"/>
    <text x="0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eaf7df">Track 2 · Edge AI</text>
  </g>

  <!-- ========== card 3: LLM agent ========== -->
  <g transform="translate(980,150)" filter="url(#shadow)">
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="#170c24" transform="translate(0,9)"/>
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="url(#faceLlm)" stroke="#b88cff" stroke-width="2"/>
    <rect x="-108" y="-78" width="216" height="156" rx="18" fill="url(#gloss)"/>
    <!-- neural core -->
    <g transform="translate(-34,-14)">
      <circle r="34" fill="url(#core)" class="breath"/>
      <g stroke="#f7e3a1" stroke-width="1.4" opacity=".85">
        <line x1="-22" y1="-14" x2="0" y2="0"/><line x1="22" y1="-14" x2="0" y2="0"/><line x1="-22" y1="14" x2="0" y2="0"/>
        <line x1="22" y1="14" x2="0" y2="0"/><line x1="-22" y1="-14" x2="-22" y2="14"/><line x1="22" y1="-14" x2="22" y2="14"/>
      </g>
      <g fill="#fff6d6">
        <circle r="5"/><circle cx="-22" cy="-14" r="3.5"/><circle cx="22" cy="-14" r="3.5"/><circle cx="-22" cy="14" r="3.5"/><circle cx="22" cy="14" r="3.5"/>
      </g>
    </g>
    <!-- chat bubble with bid -->
    <g transform="translate(46,-22)">
      <path d="M-34,-24 h68 a10,10 0 0 1 10,10 v26 a10,10 0 0 1 -10,10 h-46 l-12,10 v-10 h-10 a10,10 0 0 1 -10,-10 v-26 a10,10 0 0 1 10,-10 z" fill="#f7f1ff" opacity=".95"/>
      <text x="0" y="-6" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10" fill="#4b2a75">markup</text>
      <text x="0" y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#4b2a75">×1.12</text>
    </g>
    <text x="0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1e8ff">Track 3 · LLM agent</text>
  </g>

  <!-- foreground beans -->
  <g class="bob1"><use href="#bean" transform="translate(410,62) scale(1.05)"/></g>
  <g class="bob2"><use href="#bean" transform="translate(790,250) scale(1.1)"/></g>
  <g class="bob3"><use href="#bean" transform="translate(95,250)"/></g>

  <!-- caption -->
  <text x="600" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#e9d8c4" opacity=".8">ESP32  →  RASPBERRY PI 5  →  LLM</text>
</svg>
